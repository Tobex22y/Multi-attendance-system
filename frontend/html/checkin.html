<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Check-in — OmniAuth Attendance</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="navbar"></div>

<div class="container">
  <div class="panel" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
    <div>
      <div style="font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;">
        <i class="fa-solid fa-wand-magic-sparkles" style="color:var(--green);"></i> Multi-Auth Attendance Portal
      </div>
      <div class="profile-sub" id="subHeader"></div>
    </div>
    <div class="mfa-steps" id="stepPills"></div>
  </div>

  <div class="panel" id="statusBanner" style="background:var(--green-bg);border-color:var(--green-dim);">
    <b id="statusTitle" style="color:var(--green);">Multi-Factor Authentication Sequence Active</b>
    <div id="statusSub" style="font-size:12.5px;color:var(--text-dim);">Step 1: QR Badge Scan</div>
  </div>

  <div class="method-grid" id="methodGrid"></div>

  <div class="panel" id="stepPanel">
    <!-- populated by ../js/checkin.js -->
  </div>

  <div id="resultPanel" style="display:none;" class="panel"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script src="../js/common.js"></script>
<script src="../js/face.js"></script>
<script src="../js/checkin.js"></script>
</body>
</html>
