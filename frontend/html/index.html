<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — OmniAuth Attendance</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="nav-logo"><i class="fa-solid fa-shield-halved"></i></div>
        <div class="nav-title">
          <b>OmniAuth Attendance</b>
          <span>QR &bull; Face &bull; GPS &bull; Biometric System</span>
        </div>
      </div>

      <div class="error-msg" id="errorBox" style="display:none;"></div>

      <form id="loginForm">
        <label>Email</label>
        <input type="email" name="email" required autofocus>
        <label>Password</label>
        <input type="password" name="password" required>
        <button class="btn btn-primary btn-block" type="submit">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In
        </button>
      </form>
      <span class="muted-link">No account? <a href="register.html">Register</a></span>
      <p style="font-size:11px;color:var(--text-faint);margin-top:18px;">
        Demo accounts work after you run
        <a href="../../backend/includes/seed_helper.php" target="_blank" rel="noopener">the seed setup</a>
        once after importing the database.
      </p>
    </div>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
